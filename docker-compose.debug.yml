# Opt-in overlay that publishes the internal services on localhost for debugging tools
# (psql, RedisInsight, curl). Change the ports in .env if they clash with local services.
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8082}:8080"
