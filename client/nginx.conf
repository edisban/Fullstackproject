server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Liveness probe for the container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API requests are proxied to the backend, so the SPA and API share one origin
    # (required for the SameSite=Strict auth cookie).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port, so the backend sees the same origin as the browser's Origin
        # header (with $host, same-origin requests on non-default ports are rejected as CORS).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback; index.html must always be revalidated so new deploys are picked up.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
