spring.application.name=backend-project

# --- Database (schema managed by Flyway) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V2-V5 were deleted from the repository after being applied in some databases; don't fail on them.
spring.flyway.ignore-migration-patterns=*:missing
# One-off fix for databases whose history no longer matches (see FlywayConfig).
app.flyway.repair-on-start=${FLYWAY_REPAIR_ON_START:false}

# --- Redis (token revocation + login rate limiting) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5s

# --- Authentication ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Must be true whenever the app is served over HTTPS (i.e. in production).
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.auth.login-lockout=${LOGIN_LOCKOUT:15m}

# Admin account created on first start-up (must be provided via environment variables)
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}

# Only needed when the frontend is served from a different origin than the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Web ---
server.port=8080
# Trust X-Forwarded-* from the reverse proxy so request.getRemoteAddr() is the real client IP.
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
spring.data.web.pageable.max-page-size=100

# --- Logging ---
logging.level.root=INFO
logging.level.com.edis.backendproject=${APP_LOG_LEVEL:INFO}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
